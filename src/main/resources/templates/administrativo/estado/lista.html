<!DOCTYPE html>
<html lang="pt-br">
<head>
    <!-- Meta tags Obrigatórias -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <title>Tabela</title>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark" style="border-bottom: 3px solid white;">
    <div class="d-flex align-items-center gap-3">
    <img src="https://cdn-icons-png.flaticon.com/512/7626/7626835.png" width="40" height="40" class="d-inline-block align-top ms-2 me-2" alt="SisIcone">
    <a class="navbar-brand" href="#" >Sales System</a>
    </div>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#conteudoNavbarSuportado">
        <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="conteudoNavbarSuportado" >
        <ul class="navbar-nav me-auto">
            <li class="nav-item">
                <a class="nav-link active" href="/administrativo">Home</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#">Link</a>
            </li>
        </ul>

        <form class="d-flex">
            <input class="form-control me-2" type="search" placeholder="Pesquisar" aria-label="Pesquisar">
            <button class="btn btn-outline-light" type="submit">Pesquisar</button>
        </form>
    </div>
</nav>
	<!-- Conteúdo -->
	<div class="container mt-4">
	<table class="table table-striped table-hover" >
    <thead class="table-dark">
        <tr>
            <th>Id</th>
            <th>Nome</th>
            <th>Sigla</th>
            <th>Ação</th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="estado: ${listaEstado}">
            <td th:text="${estado.id}"></td>
            <td th:text="${estado.nome}"></td>
            <td th:text="${estado.sigla}"></td>
            <td>
                <a th:href="@{/editarEstado/{id}(id=${estado.id})}">Editar</a>
                <a th:href="@{/removerEstado/{id}(id=${estado.id})}">Remover</a>
            </td>
        </tr>
    </tbody>
</table>
<div style="text-align: right; margin-top: 10px;">
    <a class="btn btn-danger" href="/administrativo">Voltar</a>
</div>
</div>
</body>

</html>
