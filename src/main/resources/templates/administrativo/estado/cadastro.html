<! DOCTYPE html>
<html
xmlns:th="https://thymeleaf.org"
xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <!-- Meta tags Obrigatórias -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <title>Cadastro</title>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="d-flex align-items-center gap-3">
    <img src="https://cdn-icons-png.flaticon.com/512/7626/7626835.png" width="40" height="40" class="d-inline-block align-top ms-2 me-2" alt="SisIcone">
    <a class="navbar-brand" href="#" >Sales System</a>
    </div>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#conteudoNavbarSuportado">
        <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="conteudoNavbarSuportado">
        <ul class="navbar-nav me-auto">
            <li class="nav-item">
                <a class="nav-link active" href="/administrativo">Home</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#">Link</a>
            </li>
        </ul>

        <form class="d-flex">
            <input class="form-control me-2" type="search" placeholder="Pesquisar" aria-label="Pesquisar">
            <button class="btn btn-outline-light" type="submit">Pesquisar</button>
        </form>
    </div>
</nav>
<div class="container">
<form action="/salvarEstado" th:object="${estado}" method="POST">
  <div class="form-group" style="padding: 5px; margin-top: 10px;">
     <label for="id">ID:</label>
    	<input type="text" readonly="true" class="form-control" id="id" th:field="*{id}">
     <label for="nome">Nome do Estado:</label>
    	<input type="text" class="form-control" id="nome" th:field="*{nome}">
     <label for="sigla">Sigla (UF): </label>
    	<input type="text" class="form-control" id="sigla" th:field="*{sigla}">
  </div>
  <button type="submit" class="btn btn-primary">Salvar</button>
  <a class="btn btn-danger" href="/administrativo">Voltar</a>

</form>
</div>
    


    <!-- Bootstrap JS (com Popper incluso) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
