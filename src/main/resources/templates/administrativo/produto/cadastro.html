<! DOCTYPE html>
<html
xmlns:th="https://thymeleaf.org"
xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <!-- Meta tags Obrigatórias -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <title>Cadastro</title>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="d-flex align-items-center gap-3">
    <img src="https://cdn-icons-png.flaticon.com/512/7626/7626835.png" width="40" height="40" class="d-inline-block align-top ms-2 me-2" alt="SisIcone">
    <a class="navbar-brand" href="#" >Sales System</a>
    </div>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#conteudoNavbarSuportado">
        <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="conteudoNavbarSuportado">
        <ul class="navbar-nav me-auto">
            <li class="nav-item">
                <a class="nav-link active" href="/administrativo">Home</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#">Link</a>
            </li>
        </ul>

        <form class="d-flex">
            <input class="form-control me-2" type="search" placeholder="Pesquisar" aria-label="Pesquisar">
            <button class="btn btn-outline-light" type="submit">Pesquisar</button>
        </form>
    </div>
</nav>
<div class="container">
<form action="/salvarProduto" th:object="${produto}" method="POST">
  <div class="form-group" style="padding: 5px; margin-top: 10px;">
    						<!-- ID -->
     <label for="id">ID:</label>
     <input type="text" readonly="true" class="form-control" id="id" th:field="*{id}">
     						<!-- Produto -->
     <label for="nome">Nome do Produto:</label>
     <input type="text" required class="form-control" id="nome" th:field="*{nome}">
     						
     						<!-- Codigo de Barras -->
     <label for="codigoBarras">Codigo de Barras: </label>
     <input type="text" required class="form-control" id="sigla" th:field="*{codigoBarras}">
     						<!-- Unidade de medida -->
     <label for="unidadeMedida" class="form-label">Unidade de Medida:</label>
    	<select required class="form-control" id="unidadeMedida" th:field="*{unidadeMedida}">
        <option value="">Selecione</option>
        <option value="UN">UN - Unidade</option>
        <option value="CX">CX - Caixa</option>
        <option value="PC">PC - Peça</option>
        <option value="KG">KG - Quilograma</option>
        <option value="G">G - Grama</option>
        <option value="L">L - Litro</option>
        <option value="ML">ML - Mililitro</option>
        <option value="M">M - Metro</option>
        <option value="CM">CM - Centímetro</option>
        <option value="PCT">PCT - Pacote</option>
        <option value="FD">FD - Fardo</option>
    	</select>
    							<!-- Estoque -->
    	<div class="row">
    		<div class="col">
     		<label for="estoque">Estoque: </label>
    		 <input type="number" required class="form-control" th:field="*{estoque}">
    		</div>
    	
    								<!-- pCusto -->
    		<div class="col">  		
     			<label for="precoCusto">Preço de custo: </label>
     			<input type="number" required class="form-control" th:field="*{precoCusto}">
    		</div>
    								<!-- pVenda -->
    		<div class="col">
     			<label for="precoVenda">Preço de venda: </label>
     			<input type="number" required class="form-control" th:field="*{precoVenda}">
    		</div>
    								<!-- Lucro -->
    		<div class="col">
     			<label for="lucro">Lucro: </label>
     			<input type="number" required class="form-control" th:field="*{lucro}">
    		</div>			
    								<!-- MargemLucro -->
    		<div class="col">
     			<label for="margemLucro">Margem Lucro: </label>
     			<input type="number" required class="form-control" th:field="*{margemLucro}">
    		</div>
    	</div>	
    
  </div>
  								
  								<!-- botões -->
  <button type="submit" class="btn btn-success"><i class="fa-solid fa-floppy-disk"></i> Salvar</button>
  <a class="btn btn-dark" href="/listarProduto"><i class="fa-solid fa-list-check"></i> Listar</a>
  <a class="btn btn-danger" href="/administrativo"><i class="fa-solid fa-angle-left"></i> Voltar</a>
  

</form>
</div>
    


    <!-- Bootstrap JS (com Popper incluso) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
