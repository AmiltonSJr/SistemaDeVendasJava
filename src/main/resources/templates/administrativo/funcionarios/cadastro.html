<!DOCTYPE html>
<html xmlns:th="https://thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <title>Cadastro</title>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <div class="d-flex align-items-center gap-3">
                <img src="https://cdn-icons-png.flaticon.com/512/7626/7626835.png" width="40" height="40" class="d-inline-block align-top ms-2 me-2" alt="SisIcone">
                <a class="navbar-brand" href="#">Sales System</a>
            </div>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#conteudoNavbarSuportado">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="conteudoNavbarSuportado">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link active" href="/administrativo">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Link</a></li>
                </ul>
                <form class="d-flex">
                    <input class="form-control me-2" type="search" placeholder="Pesquisar">
                    <button class="btn btn-outline-light" type="submit">Pesquisar</button>
                </form>
            </div>
        </div>
    </nav>
										<!-- Labels -->
										
    <div class="container mt-3">
        <form action="/salvarFuncionario" th:object="${funcionario}" method="POST">
            
            							<!-- ID -->
            <div class="mb-3">
                <label for="id" class="form-label">ID:</label>
                <input type="text" readonly class="form-control" id="id" th:field="*{id}">
            </div>

            							<!-- Nome -->
            <div class="mb-3">
                <label for="nome" class="form-label">Nome do Funcionario:</label>
                <input type="text" required class="form-control" id="nome" th:field="*{nome}">
            </div>
            							<!-- CPF -->
            <div class="mb-3">
                <label for="cpf" class="form-label">CPF:</label>
                <input type="text" required class="form-control" id="cpf" th:field="*{cpf}">
            </div>
            							<!-- Telefone -->
            <div class="mb-3">
                <label for="telefone" class="form-label">Telefone:</label>
                <input type="text" required class="form-control" id="telefone" th:field="*{telefone}">
            </div>
            							<!-- Endereço -->
            <div class="mb-3">
                <label for="endereco" class="form-label">Endereço:</label>
                <input type="text" required class="form-control" id="endereco" th:field="*{endereco}">
            </div>
            							<!-- Número -->
            <div class="mb-3">
                <label for="numero" class="form-label">Número:</label>
                <input type="text" required class="form-control" id="numero" th:field="*{numero}" maxlength="8">
            </div>
            							<!-- Bairro -->
            <div class="mb-3">
                <label for="bairro" class="form-label">Bairro:</label>
                <input type="text" required class="form-control" id="bairro" th:field="*{bairro}">
            </div>
            							<!-- Email -->
            <div class="mb-3">
                <label for="email" class="form-label">E-mail:</label>
                <input type="text" class="form-control" id="email" th:field="*{email}">
            </div>
            							<!-- Funcao -->
            <div class="mb-3">
                <label for="funcao" class="form-label">Função:</label>
                <input type="text" required class="form-control" id="funcao" th:field="*{funcao}">
            </div>

            							<!-- Cidade -->
            <div class="mb-3">
                <label class="form-label">Cidade:</label>
                <select th:field="*{cidade}" class="form-select">
                    <option th:each="est : ${listaCidade}" th:value="${est.id}" th:text="${est.nome}"></option>
                </select>
            </div>
            						


           								 <!-- BOTÕES -->
            <div class="mb-3">
                <button type="submit" class="btn btn-success">
                    <i class="fa-solid fa-floppy-disk"></i> Salvar
                </button>
                <a class="btn btn-dark" href="/listarFuncionario">
                    <i class="fa-solid fa-list-check"></i> Listar
                </a>
                <a class="btn btn-danger" href="/administrativo">
                    <i class="fa-solid fa-angle-left"></i> Voltar
                </a>
            </div>

        </form>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.mask/1.14.16/jquery.mask.min.js" integrity="sha512-pHVGpX7F/27yZ0ISY+VVjyULApbDlD0/X0rgGbTqCE7WFW5MezNTWG/dnhtbBuICzsd0WQPgpE4REBLv+UqChw==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        $('#cpf').mask('000.000.000-00', {reverse: true});
        $('#telefone').mask('(00)00000-0000');
    </script>
</body>
</html>
