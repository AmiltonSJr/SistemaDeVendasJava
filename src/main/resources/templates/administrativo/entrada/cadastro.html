<!DOCTYPE html>
<html xmlns:th="https://thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <title>Cadastro</title>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <div class="d-flex align-items-center gap-3">
                <img src="https://cdn-icons-png.flaticon.com/512/7626/7626835.png" width="40" height="40" class="d-inline-block align-top ms-2 me-2" alt="SisIcone">
                <a class="navbar-brand" href="#">Sales System</a>
            </div>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#conteudoNavbarSuportado">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="conteudoNavbarSuportado">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link active" href="/administrativo">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Link</a></li>
                </ul>
                <form class="d-flex">
                    <input class="form-control me-2" type="search" placeholder="Pesquisar">
                    <button class="btn btn-outline-light" type="submit">Pesquisar</button>
                </form>
            </div>
        </div>
    </nav>

    <div class="container mt-3">
        <form action="/salvarEntrada" th:object="${entrada}" method="POST">
            
            <!-- ID -->
            <div class="mb-3">
                <label for="id" class="form-label">ID:</label>
                <input type="text" readonly class="form-control" id="id" th:field="*{id}">
            </div>

            <!-- OBS -->
            <div class="mb-3">
                <label for="nome" class="form-label">Observação:</label>
                <input type="text" required class="form-control" id="nome" th:field="*{obs}">
            </div>


            <!--Funcionario -->
            <div class="mb-3">
                <label class="form-label">Funcionário:</label>
                <select th:field="*{funcionario}" class="form-select">
                    <option th:each="est : ${listaFuncionarios}" th:value="${est.id}" th:text="${est.nome}"></option>
                </select>
            </div>
            
            <!--Fornecedores -->
            <div class="mb-3">
                <label class="form-label">Fornecedores:</label>
                <select th:field="*{fornecedor}" class="form-select">
                    <option th:each="est : ${listaFornecedores}" th:value="${est.id}" th:text="${est.nome}"></option>
                </select>
            </div>
            
            <div class="mb-3">
                <label class="form-label">Valor Total: </label>
                <input type="text" readonly="readonly" required class="form-control" th:field="*{valorTotal}">
            </div>
            
            <div class="mb-3">
                <label class="form-label">Quantidade Total: </label>
                <input type="text" readonly="readonly" required class="form-control" th:field="*{quantidadeTotal}">
            </div>
            
            <!-- Começa itemEntrada abaixo -->
            <div class="form-row" th:object="${itemEntrada}">
            
           		<div class="mb-3">
                <label class="form-label">Produto:</label>
                <select th:field="*{produto}" class="form-select">
                    <option th:each="est : ${listaProdutos}" th:value="${est.id}" th:text="${est.nome}"></option>
                </select>
                
                <label class="form-label">Quantidade: </label>
                <input type="text" readonly="readonly" required class="form-control" th:field="*{quantidade}">
                
                <label class="form-label">Valor Custo: </label>
                <input type="text" readonly="readonly" required class="form-control" th:field="*{valorCusto}">
                
                <label class="form-label">Valor Total: </label>
                <input type="text" readonly="readonly" required class="form-control" th:field="*{valor}">
                
          
            	<button name="acao" th:value="itens" type="submit" class="btn btn-primary">Adicionar</button>
            	</div>
  				<!-- Tabela com os itens -->
  				
  				   <table class="table table-striped table-hover" id="tabela">
           		   <thead class="table-dark">
                		<tr>
                   		 <th>Id</th>
                   		 <th>Produto</th>
                   		 <th>Quantidade</th>
                   		 <th>Valor Custo</th>
                   		 <th>Valor Venda</th>
                   		 <th>Ação</th>
                		</tr>
            		</thead>
            		<tbody>
               			 <tr th:each="itemEntrada: ${listaItemEntrada}">
                   		 <td th:text="${itemEntrada.id}"></td>
                   		 <td th:text="${itemEntrada.produto.nome}"></td>
                   		 <td th:text="${itemEntrada.quantidade}"></td>
                   		 <td th:text="${itemEntrada.valorCusto}"></td>
                   		 <td th:text="${itemEntrada.valorVenda}"></td>
                   		 <td colspan="2">
                    	    <a th:href="@{/editaritemEntrada/{id}(id=${itemEntrada.id})}" class="btn btn-sm btn-primary"><i class="fas fa-edit"></i></a>
                    	    <a th:href="@{/removeritemEntrada/{id}(id=${itemEntrada.id})}" class="btn btn-sm btn-danger"><i class="fas fa-trash"></i></a>
                  		  </td>
              			  </tr>
           			 </tbody>
       				 </table>        
            
            </div>
            

            <!-- BOTÕES -->
            <div class="mb-3">
                <button type="submit" class="btn btn-success">
                    <i class="fa-solid fa-floppy-disk"></i> Salvar
                </button>
                <a class="btn btn-dark" href="/listarEntrada">
                    <i class="fa-solid fa-list-check"></i> Listar
                </a>
                <a class="btn btn-danger" href="/administrativo">
                    <i class="fa-solid fa-angle-left"></i> Voltar
                </a>
            </div>

        </form>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.mask/1.14.16/jquery.mask.min.js" integrity="sha512-pHVGpX7F/27yZ0ISY+VVjyULApbDlD0/X0rgGbTqCE7WFW5MezNTWG/dnhtbBuICzsd0WQPgpE4REBLv+UqChw==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        $(document).ready(function(){
            $('#cep').mask('00000-000');
        });
    </script>
</body>
</html>
